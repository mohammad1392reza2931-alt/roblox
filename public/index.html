  else if(m.t==="s"){if(st==="joining")st="match";turn=m.tn;arN=m.ar;sync(m.ps,1);m.es.forEach(a=>{const e=ES[a[0]];if(e){e.tx=a[1];e.tz=a[2];e.a=a[3]}})}
  else if(m.t==="ent"){m.e.forEach(addEnt);$("#oc").classList.remove("on");$("#od").classList.remove("on")}
  else if(m.t==="stroke")seg(m.p,m.n);else if(m.t==="clr")wipe();
  else if(m.t==="bolt"){const b=M("y",0xffffcc,[m.x,15,m.z],[.5,30,.5],{emissive:0xffffaa,emissiveIntensity:2});S.add(b);bolts.push([b,now+.35])}
  else if(m.t==="msg")say(m.text);else if(m.t==="note")say(m.text,5);
  else if(m.t==="draw")openDraw(m.secs);else if(m.t==="out")fin(m);else if(m.t==="done"){$("#oc").classList.remove("on");$("#od").classList.remove("on")}})}
function fin(m){if(st==="end")return;st="end";$("#et").textContent=m.win?"🏆 برنده شدی!":"💀 حذف شدی";$("#es").textContent=m.win?"آخرین نفر زنده‌ی جزیره تو بودی":"رتبه‌ی تو: "+m.rank;$("#oe").classList.add("on");$("#od").classList.remove("on");$("#oc").classList.remove("on")}
$("#eb").onclick=()=>{if(ws)ws.close();joinLobby()};
$("#go").onclick=()=>{NAME=($("#nm").value||"بازیکن").trim().slice(0,12);$("#on").classList.remove("on");joinLobby()};
const solo=()=>{NAME=($("#nm").value||NAME||"بازیکن").trim().slice(0,12);$("#on").classList.remove("on");st="joining";if(ws)ws.close();joinRoom("solo"+Math.random().toString(36).slice(2,8),1,"&bots=5")};$("#solo").onclick=$("#sb").onclick=solo;
// ---------- ورودی ----------
addEventListener("keydown",e=>keys[e.key.toLowerCase()]=1);addEventListener("keyup",e=>keys[e.key.toLowerCase()]=0);
const gc=R.domElement;gc.addEventListener("pointerdown",e=>{if(e.pointerType==="touch"&&e.clientX<innerWidth/2)joy={sx:e.clientX,sy:e.clientY,x:e.clientX,y:e.clientY,id:e.pointerId};else look={x:e.clientX,y:e.clientY,id:e.pointerId}});
gc.addEventListener("pointermove",e=>{if(joy&&e.pointerId===joy.id){joy.x=e.clientX;joy.y=e.clientY}else if(look&&e.pointerId===look.id){yaw-=(e.clientX-look.x)*.006;pitch=Math.max(.08,Math.min(1.2,pitch+(e.clientY-look.y)*.004));look.x=e.clientX;look.y=e.clientY}});
["pointerup","pointercancel"].forEach(n=>addEventListener(n,e=>{if(joy&&e.pointerId===joy.id)joy=null;if(look&&e.pointerId===look.id)look=null}));
// ---------- نقاشی ----------
const dc=$("#dc"),dx=dc.getContext("2d");let pen=false,pend=[],pn=false,lf=0;
const wd=()=>{dx.fillStyle="#fff";dx.fillRect(0,0,360,240)};
function openDraw(secs){drawT=secs||30;strokes=0;wd();$("#od").classList.add("on")}
function dp(e){const r=dc.getBoundingClientRect();return[Math.round((e.clientX-r.left)*360/r.width),Math.round((e.clientY-r.top)*240/r.height)]}
function flush(){if(pend.length&&ws&&ws.readyState===1)ws.send(JSON.stringify({t:"stroke",p:pend,n:pn?1:0}));pend=[];pn=false}
function add(q,first){seg([q],first);pend.push(q);if(first)pn=true;if(now-lf>.08){lf=now;flush()}}
dc.addEventListener("pointerdown",e=>{pen=true;flush();const q=dp(e);dx.lineWidth=5;dx.lineCap="round";dx.strokeStyle="#111";dx.beginPath();dx.moveTo(...q);dx.lineTo(q[0]+.1,q[1]);dx.stroke();strokes++;add(q,true);e.preventDefault()});
dc.addEventListener("pointermove",e=>{if(!pen)return;const q=dp(e);dx.lineTo(...q);dx.stroke();add(q,false);e.preventDefault()});
addEventListener("pointerup",()=>{if(pen){pen=false;flush()}});
$("#dclr").onclick=()=>{wd();wipe();strokes=0;if(ws)ws.send(JSON.stringify({t:"clr"}))};
$("#dok").onclick=sendDraw;
function sendDraw(){if(!$("#od").classList.contains("on"))return;flush();$("#od").classList.remove("on");$("#oc").classList.add("on");ws.send(JSON.stringify({t:"draw",img:strokes>0?dc.toDataURL("image/jpeg",.6):""}))}
// ---------- حلقه ----------
function hud(){$("#sb").style.display=st==="lobby"?"block":"none";if(!me)return;if(st==="lobby"){const n=Object.values(byId).filter(p=>Math.abs(p.x)<15&&p.z>-43&&p.z<-25).length;$("#h1").textContent="🏠 لابی • "+Object.keys(byId).length+" بازیکن";$("#h2").textContent="شروع صف: "+Math.ceil(qt)+" ثانیه • توی صف: "+n+"/10"+(Math.abs(me.x)<15&&me.z>-43&&me.z<-25?" ✅":"")}
 else if(st==="match"||st==="end"){const a=Object.values(byId).filter(p=>p.alive).length;$("#h1").textContent="❤️ "+Math.ceil(me.hp)+"  |  زنده: "+a+"/"+Object.keys(byId).length;$("#h2").textContent=(arN?"نقاش: "+arN:"نقاش بعدی: "+Math.ceil(turn)+"ث")+" • موجودات: "+Object.keys(ES).length}}
let last=performance.now();
function loop(t){requestAnimationFrame(loop);const dt=Math.min(.05,(t-last)/1000);last=t;now=t/1000;
 if(msgT>0&&(msgT-=dt)<=0)$("#msg").textContent="";
 if((st==="lobby"||st==="match")&&ws&&t-lastMsg>4000){say("⚠️ از سرور خبری نیست...",1);if(st==="lobby"&&t-lastMsg>8000){lastMsg=t;ws.close()}}
 const pa=sea.geometry.attributes.position.array;for(let i=0;i<pa.length;i+=3)pa[i+2]=sp0[i+2]+Math.sin(now*.8+sp0[i]*.05+sp0[i+1]*.07)*.6;sea.geometry.attributes.position.needsUpdate=true;
 if(me&&(st==="lobby"||st==="match")){
  let ax=(keys.arrowright||keys.d?1:0)-(keys.arrowleft||keys.a?1:0),ay=(keys.arrowdown||keys.s?1:0)-(keys.arrowup||keys.w?1:0);
  if(joy){const jx=joy.x-joy.sx,jy=joy.y-joy.sy,l=Math.hypot(jx,jy);if(l>8){const k=Math.min(1,l/50)/l;ax=jx*k;ay=jy*k}}
  const l=Math.hypot(ax,ay);if(l>1){ax/=l;ay/=l}
  const mx=Math.cos(yaw)*ax+Math.sin(yaw)*ay,mz=-Math.sin(yaw)*ax+Math.cos(yaw)*ay;me.sp=0;
  if(!me.busy&&me.alive){const v=9*me.slow*(Math.hypot(me.x,me.z)>77?.6:1)*dt;me.x+=mx*v;me.z+=mz*v;me.sp=Math.hypot(ax,ay);if(me.sp>.05)me.ry=Math.atan2(mx,mz)}
  if(st==="lobby"){me.x=Math.max(-40,Math.min(40,me.x));me.z=Math.max(-50,Math.min(50,me.z))}else{const d=Math.hypot(me.x,me.z);if(d>100){me.x*=100/d;me.z*=100/d}}
  if(ws&&ws.readyState===1&&t-lastPos>100){lastPos=t;const k=st==="lobby"?10:1;ws.send(JSON.stringify({t:"pos",x:me.x*k,[st==="lobby"?"y":"z"]:me.z*k}))}
 }
 for(const id in byId){const p=byId[id],g=p.g;if(p!==me){const ox=p.x,oz=p.z,k=Math.min(1,dt*10);p.x+=(p.tx-p.x)*k;p.z+=(p.tz-p.z)*k;const sp=Math.hypot(p.x-ox,p.z-oz)/dt;p.sp=sp>.5?1:0;if(sp>.5)p.ry=Math.atan2(p.x-ox,p.z-oz)}
  g.visible=p.alive;g.position.x=p.x;g.position.z=p.z;const sw=st==="match"&&p.alive&&!p.busy&&Math.hypot(p.x,p.z)>77;p.rip.visible=sw;if(sw){const k=(now*1.2)%1;p.rip.position.set(p.x,-.55,p.z);p.rip.scale.setScalar(1+k*3);p.rip.material.opacity=.6*(1-k)}
  if(p.busy){p.ry=Math.PI;g.position.y=.9;p.lb.ll.rotation.x=p.lb.rl.rotation.x=-1.5;p.lb.ra.rotation.x=-1.6+Math.sin(now*9)*.3;p.lb.la.rotation.x=-.4}
  else if(sw){p.ph+=dt*7;const I=p.lb;g.position.y=-1.1+Math.sin(now*3+p.ph)*.15;I.ra.rotation.x=p.ph;I.la.rotation.x=p.ph+Math.PI;I.ll.rotation.x=Math.sin(p.ph*3)*.4;I.rl.rotation.x=-Math.sin(p.ph*3)*.4;g.rotation.x+=(1.25-g.rotation.x)*Math.min(1,dt*8)}
  else{g.rotation.x*=1-Math.min(1,dt*8);g.position.y=0;p.ph+=dt*10;const w=Math.sin(p.ph)*(p.sp?.7:0);p.lb.la.rotation.x=w;p.lb.ra.rotation.x=-w;p.lb.ll.rotation.x=-w;p.lb.rl.rotation.x=w}
  g.rotation.y+=(((p.ry-g.rotation.y+Math.PI*3)%(Math.PI*2))-Math.PI)*Math.min(1,dt*12)}
 for(const id in ES){const e=ES[id],a=now-e.t0;if(a<0){e.g.visible=false;continue}e.g.visible=true;const k=Math.min(1,dt*8);e.x+=(e.tx-e.x)*k;e.z+=(e.tz-e.z)*k;e.g.position.x=e.x;e.g.position.z=e.z;
  if(e.mv==="chase"||e.mv==="wander")e.g.rotation.y=Math.PI/2-e.a;else if(e.mv==="orbit")e.g.rotation.y=-e.a;e.g.u(now,a)}
 bolts=bolts.filter(b=>{if(now>b[1]){S.remove(b[0]);return false}b[0].visible=Math.random()>.2;return true});
 if(me){if(me.busy)yaw+=(0-yaw)*Math.min(1,dt*3);const D=me.busy?13:15,cp=Math.cos(pitch);cam.position.set(me.x+Math.sin(yaw)*cp*D,3.5+Math.sin(pitch)*D,me.z+Math.cos(yaw)*cp*D);cam.lookAt(me.x,me.busy?7:3.2,me.z+(me.busy?-20:0))}
 else{cam.position.set(Math.sin(now*.1)*80,35,Math.cos(now*.1)*80);cam.lookAt(0,0,0)}
 hud();R.render(S,cam)}
requestAnimationFrame(loop);
</script></body></html>
